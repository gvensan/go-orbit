<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit Graph · sample</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0a0f1c; color: #e2e8f0;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    padding: 24px;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.25em; color: #64748b; }
  h1 { margin: 2px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: #f1f5f9; }
  .stats { display: flex; align-items: center; gap: 20px; }
  .stat { display: flex; flex-direction: column; line-height: 1; }
  .stat .n { font-size: 18px; font-weight: 600; color: #f1f5f9; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-top: 3px; }
  button.reset { background: transparent; color: #94a3b8; border: 1px solid #334155; border-radius: 6px;
    padding: 7px 12px; font-size: 12px; cursor: pointer; font-family: inherit; transition: .15s; }
  button.reset:hover { border-color: #64748b; color: #f1f5f9; }
  .layout { display: grid; grid-template-columns: 1fr 260px; gap: 16px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .canvas-wrap { position: relative; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; background: #070b16; }
  .glow { position: absolute; inset: 0; pointer-events: none; opacity: .4;
    background: radial-gradient(600px 400px at 50% 40%, rgba(56,89,150,.12), transparent 70%); }
  svg { width: 100%; display: block; touch-action: none; user-select: none; }
  .legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px;
    background: rgba(7,11,22,.8); backdrop-filter: blur(6px); padding: 8px 12px; border: 1px solid #1e293b; border-radius: 8px; }
  .legend .row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #94a3b8; }
  .legend .swatch { width: 16px; height: 2px; display: inline-block; }
  .hint { position: absolute; right: 12px; top: 10px; font-size: 10px; color: #475569; }
  .panel { border: 1px solid #1e293b; border-radius: 12px; background: #070b16; padding: 16px; }
  .panel h2 { margin: 0; font-size: 16px; color: #f1f5f9; }
  .panel .sub { font-size: 11px; color: #64748b; margin: 2px 0 16px; }
  .cap { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #475569; margin-bottom: 8px; }
  .orgrow, .connrow { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .orgrow { margin-bottom: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
  .name { color: #cbd5e1; }
  .deg { color: #64748b; }
  .conn-list { display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow: auto; margin: 0 -6px; }
  .connrow { width: 100%; background: transparent; border: 0; color: inherit; text-align: left;
    padding: 5px 8px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  .connrow:hover { background: rgba(30,41,59,.6); }
  .muted { font-size: 12px; color: #64748b; line-height: 1.6; }
  .clearbtn { margin-top: 16px; width: 100%; font-size: 12px; color: #94a3b8; border: 1px solid #334155;
    background: transparent; border-radius: 6px; padding: 7px; cursor: pointer; font-family: inherit; transition: .15s; }
  .clearbtn:hover { border-color: #64748b; color: #f1f5f9; }
  .two { display: flex; gap: 20px; margin-bottom: 16px; }
</style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow mono">Relationship graph · sample</div>
      <h1>100 contacts, mapped</h1>
    </div>
    <div class="stats mono">
      <div class="stat"><span class="n" id="s-nodes">0</span><span class="l">nodes</span></div>
      <div class="stat"><span class="n" id="s-edges">0</span><span class="l">edges</span></div>
      <div class="stat"><span class="n" id="s-orgs">0</span><span class="l">orgs</span></div>
      <button class="reset" id="reset">Reset view</button>
    </div>
  </header>

  <div class="layout">
    <div class="canvas-wrap">
      <div class="glow"></div>
      <svg id="graph" viewBox="0 0 900 600"></svg>
      <div class="legend mono" id="legend"></div>
      <div class="hint mono">scroll = zoom · drag bg = pan · drag node = move · click = focus</div>
    </div>
    <div class="panel" id="panel"></div>
  </div>

<script>
// ---------- deterministic data ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ORGS=[{name:"Acme Corp",color:"#5eead4"},{name:"Globex",color:"#93c5fd"},{name:"Initech",color:"#f0abfc"},{name:"Umbrella",color:"#fca5a5"},{name:"Wayne Ent.",color:"#fcd34d"},{name:"Hooli",color:"#c4b5fd"}];
const EDGE_TYPES={colleague:{color:"#3b6ea5",label:"Colleague",width:1},family:{color:"#c2708e",label:"Family",width:1.6},introduced:{color:"#d9a441",label:"Introduced by",width:1.4},friend:{color:"#4c9a86",label:"Friend",width:1}};
const FIRST=["Ava","Liam","Noah","Emma","Olivia","Sophia","Mason","Lucas","Mia","Ethan","Isabella","Aiden","Riya","Arjun","Wei","Chen","Priya","Diego","Sofia","Yuki","Omar","Fatima","Kai","Nina","Leo","Zara","Ivan","Maya","Raj","Elena","Hana","Sven","Lucia","Amir","Grace","Tomas","Ines","Kofi","Lena","Paulo"];
const LAST=["Chen","Patel","Kim","Garcia","Okafor","Nguyen","Silva","Haddad","Rossi","Novak","Khan","Torres","Ivanov","Tanaka","Mensah","Cohen","Reyes","Singh","Muller","Abbas"];
const ROLES=["Eng Lead","Designer","PM","Founder","Analyst","Recruiter","Sales","Ops","Legal","Data Sci","Marketer","CFO"];

function generateGraph(){
  const rnd=mulberry32(42), ri=n=>Math.floor(rnd()*n), N=100, nodes=[];
  for(let i=0;i<N;i++){let o=ri(ORGS.length); if(rnd()<0.35)o=ri(3);
    nodes.push({id:i,name:`${FIRST[ri(FIRST.length)]} ${LAST[ri(LAST.length)]}`,org:o,role:ROLES[ri(ROLES.length)]});}
  const seen=new Set(), links=[], key=(a,b)=>a<b?`${a}-${b}`:`${b}-${a}`;
  const add=(a,b,type)=>{if(a===b)return;const k=key(a,b);if(seen.has(k))return;seen.add(k);links.push({source:a,target:b,type});};
  const byOrg=ORGS.map((_,o)=>nodes.filter(n=>n.org===o).map(n=>n.id));
  byOrg.forEach(m=>m.forEach(id=>{const d=1+ri(3);for(let k=0;k<d;k++)add(id,m[ri(m.length)],"colleague");}));
  for(let f=0;f<7;f++){const size=2+ri(3),fam=[];for(let k=0;k<size;k++)fam.push(ri(N));
    for(let a=0;a<fam.length;a++)for(let b=a+1;b<fam.length;b++)add(fam[a],fam[b],"family");}
  for(let k=0;k<16;k++)add(ri(N),ri(N),"introduced");
  for(let k=0;k<12;k++)add(ri(N),ri(N),"friend");
  const deg=new Array(N).fill(0); links.forEach(l=>{deg[l.source]++;deg[l.target]++;}); nodes.forEach(n=>n.degree=deg[n.id]);
  return {nodes,links};
}

// ---------- setup ----------
const W=900,H=600, {nodes,links}=generateGraph();
const maxDeg=d3.max(nodes,n=>n.degree)||1;
const rScale=d3.scaleSqrt().domain([0,maxDeg]).range([3.5,15]);
const adj=new Map(nodes.map(n=>[n.id,new Set()]));
links.forEach(l=>{adj.get(l.source).add(l.target);adj.get(l.target).add(l.source);});

document.getElementById("s-nodes").textContent=nodes.length;
document.getElementById("s-edges").textContent=links.length;
document.getElementById("s-orgs").textContent=ORGS.length;

const legend=document.getElementById("legend");
Object.values(EDGE_TYPES).forEach(v=>{
  const r=document.createElement("div"); r.className="row";
  r.innerHTML=`<span class="swatch" style="background:${v.color}"></span>${v.label}`; legend.appendChild(r);
});

const svg=d3.select("#graph");
const root=svg.append("g");
const linkSel=root.append("g").selectAll("line").data(links).join("line")
  .attr("stroke",d=>EDGE_TYPES[d.type].color).attr("stroke-width",d=>EDGE_TYPES[d.type].width).attr("stroke-opacity",0.32);
const nodeSel=root.append("g").selectAll("g").data(nodes).join("g").style("cursor","pointer");
nodeSel.append("circle").attr("class","halo").attr("fill","none").attr("stroke-width",1.5).attr("opacity",0);
nodeSel.append("circle").attr("class","body").attr("r",d=>rScale(d.degree))
  .attr("fill",d=>ORGS[d.org].color).attr("stroke","#070b16").attr("stroke-width",1.2);
nodeSel.append("text").attr("class","lbl mono").attr("text-anchor","middle").attr("fill","#e2e8f0")
  .attr("font-size",11).attr("y",d=>-rScale(d.degree)-4).style("pointer-events","none")
  .style("opacity",d=>d.degree>9?1:0).text(d=>d.name);

// ---------- force sim ----------
const sim=d3.forceSimulation(nodes)
  .force("link",d3.forceLink(links).id(d=>d.id).distance(l=>l.type==="colleague"?34:78).strength(l=>l.type==="colleague"?0.7:0.12))
  .force("charge",d3.forceManyBody().strength(-130))
  .force("center",d3.forceCenter(W/2,H/2))
  .force("collide",d3.forceCollide().radius(d=>rScale(d.degree)+2))
  .on("tick",ticked);
function ticked(){
  linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}

// ---------- zoom / pan ----------
const zoom=d3.zoom().scaleExtent([0.3,5]).on("zoom",e=>root.attr("transform",e.transform));
svg.call(zoom);
document.getElementById("reset").onclick=()=>svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity);

// ---------- drag ----------
nodeSel.call(d3.drag()
  .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(0.25).restart();d.fx=d.x;d.fy=d.y;d.__moved=false;})
  .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;d.__moved=true;})
  .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;if(!d.__moved)select(d.id===selected?null:d.id);}));

// ---------- focus / ego-network ----------
let selected=null;
function select(id){ selected=id; render(); }
function render(){
  const neigh=selected!=null?adj.get(selected):null;
  const isDim=id=>selected!=null&&id!==selected&&!(neigh&&neigh.has(id));
  nodeSel.attr("opacity",d=>isDim(d.id)?0.18:1);
  nodeSel.select(".halo").attr("r",d=>rScale(d.degree)+5).attr("stroke",d=>ORGS[d.org].color)
    .attr("opacity",d=>d.id===selected?0.9:0);
  nodeSel.select(".lbl").style("opacity",d=>(d.id===selected||d.degree>9)?1:0);
  linkSel.attr("stroke-opacity",l=>{
    if(selected==null)return 0.32;
    const s=l.source.id??l.source,t=l.target.id??l.target;
    return (s===selected||t===selected)?0.85:0.05;
  });
  drawPanel();
}

// ---------- side panel ----------
const panel=document.getElementById("panel");
function drawPanel(){
  if(selected==null){
    panel.innerHTML=`<div class="cap mono">Organizations</div>`+
      ORGS.map((o,i)=>{const c=nodes.filter(n=>n.org===i).length;
        return `<div class="orgrow"><span class="name"><span class="dot" style="background:${o.color}"></span>${o.name}</span><span class="deg mono">${c}</span></div>`;}).join("")+
      `<p class="muted" style="margin-top:16px">Node size scales with degree — bigger dots are your connectors. Click any contact to isolate their network.</p>`;
    return;
  }
  const sel=nodes[selected], neigh=adj.get(selected);
  const conns=[...neigh].map(id=>nodes[id]).sort((a,b)=>b.degree-a.degree);
  const crossOrg=conns.filter(c=>c.org!==sel.org).length;
  panel.innerHTML=
    `<h2><span class="dot" style="background:${ORGS[sel.org].color}"></span>${sel.name}</h2>`+
    `<div class="sub mono">${sel.role} · ${ORGS[sel.org].name}</div>`+
    `<div class="two">
       <div class="stat"><span class="n" style="font-size:18px">${sel.degree}</span><span class="l">connections</span></div>
       <div class="stat"><span class="n" style="font-size:18px">${crossOrg}</span><span class="l">cross-org</span></div>
     </div>`+
    `<div class="cap mono">Connected to</div><div class="conn-list">`+
    conns.map(c=>`<button class="connrow" data-id="${c.id}"><span class="name"><span class="dot" style="width:8px;height:8px;background:${ORGS[c.org].color}"></span>${c.name}</span><span class="deg mono">${c.degree}</span></button>`).join("")+
    `</div><button class="clearbtn" id="clear">Clear focus</button>`;
  panel.querySelectorAll(".connrow").forEach(b=>b.onclick=()=>select(+b.dataset.id));
  panel.querySelector("#clear").onclick=()=>select(null);
}
drawPanel();
</script>
</body>
</html>
