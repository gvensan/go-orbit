appId: com.orbit.app
productName: Orbit
copyright: © Orbit

directories:
  output: dist
  buildResources: build   # build/icon.png -> platform icons are generated here

# The renderer ships prebuilt (vite build -> dist/renderer); renderer sources
# and their deps (sigma etc.) stay out of the package.
files:
  - "src/main/**/*"
  - "src/shared/**/*"
  - "dist/renderer/**/*"
  - "package.json"
  - "!**/*.md"

# Rebuild the native module (better-sqlite3-multiple-ciphers) against Electron's ABI.
npmRebuild: true

# Auto-update feed — see docs/BUILD_AND_RELEASE.md §4.
publish:
  provider: github
  # CI promotes the draft only after signing, update metadata, and launch
  # checks pass for every platform.
  releaseType: draft

mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true            # requires APPLE_ID / API key secrets in CI
  target:
    - dmg
    - zip

win:
  target:
    - nsis
    - portable
  # signtool/cloud signing configured via CSC_LINK / CSC_KEY_PASSWORD secrets

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Utility
  maintainer: Orbit
  vendor: Orbit
  # Keep the generated .desktop filename and Chromium WM_CLASS aligned so
  # Linux desktops group Orbit windows under the installed launcher icon.
  syncDesktopName: true
  target:
    - AppImage
    - deb
    - rpm
