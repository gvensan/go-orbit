name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A hung test must fail the job, not hold a runner for six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS is the supported platform; Ubuntu is a cheap second opinion that
        # catches "works only on my Mac". Windows is not a target (see DECISIONS.md).
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The encrypted SQLite addon must load from its prebuilt binary on stock Node.
      - run: npm run verify:native
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm run migrate:ci
      - run: npm run build
      # Per-test timeout and the spec reporter, so a hang names the test in the log.
      - run: npm test -- --test-timeout=120000 --test-reporter=spec --test-reporter-destination=stdout
