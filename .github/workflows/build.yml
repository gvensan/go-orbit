name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Keep superseded check-in builds from consuming all three hosted runners.
# A release build is never cancelled once its tag has been pushed.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# ABI note: there is no postinstall rebuild. After `npm ci` the native module
# targets the Node ABI, which is what typecheck/migrate/fixture/test need.
# Packaging rebuilds it for Electron (prebuild hook); the post-build smoke test
# deliberately switches the working tree back to the Node ABI.

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Verify release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run migrate:ci
      - run: npm run fixture
      - run: npm test

  # Every main-branch check-in and PR gets downloadable, unsigned installers.
  # Builds run on their target OS because the encrypted SQLite module is native.
  package:
    name: Package (${{ matrix.platform }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            electron_cache: ~/Library/Caches/electron
            builder_cache: ~/Library/Caches/electron-builder
          - platform: Windows
            os: windows-latest
            electron_cache: ~/AppData/Local/electron/Cache
            builder_cache: ~/AppData/Local/electron-builder/Cache
          - platform: Linux
            os: ubuntu-latest
            electron_cache: ~/.cache/electron
            builder_cache: ~/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.electron_cache }}
            ${{ matrix.builder_cache }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install rpm tooling (Linux)
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build unsigned installers
        run: npm run build -- --publish never
        env:
          # Check-in artifacts are for validation, not distribution. Disabling
          # discovery also prevents an incidental runner identity from signing.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # electron-builder 24 reads this standard CI slug while generating
          # update metadata, even when it is explicitly told not to publish.
          TRAVIS_REPO_SLUG: ${{ github.repository }}
      - name: Smoke test encrypted database
        shell: bash
        run: |
          npm run rebuild:node
          node scripts/smoke-open-db.js
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Version tags publish signed/notarized installers to GitHub Releases.
  release:
    name: Release (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            electron_cache: ~/Library/Caches/electron
            builder_cache: ~/Library/Caches/electron-builder
          - platform: Windows
            os: windows-latest
            electron_cache: ~/AppData/Local/electron/Cache
            builder_cache: ~/AppData/Local/electron-builder/Cache
          - platform: Linux
            os: ubuntu-latest
            electron_cache: ~/.cache/electron
            builder_cache: ~/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.electron_cache }}
            ${{ matrix.builder_cache }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install rpm tooling (Linux)
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Verify release signing credentials
        if: matrix.platform != 'Linux'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ "${{ matrix.platform }}" == "macOS" ]]; then
            for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              [[ -n "${!name}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
            done
          else
            for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
              [[ -n "${!name}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
            done
          fi
      - name: Build and publish signed release
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAVIS_REPO_SLUG: ${{ github.repository }}
          # macOS signing and notarization
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Smoke test encrypted database
        shell: bash
        run: |
          npm run rebuild:node
          node scripts/smoke-open-db.js
