name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Keep superseded check-in builds from consuming all three hosted runners.
# A release build is never cancelled once its tag has been pushed.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# ABI note: the workspace always targets Electron's embedded Node ABI.
# postinstall performs a forced native rebuild; tests, migrations, fixtures,
# and source smoke checks run through scripts/electron-node.js so no command can
# leave development unable to launch after silently switching back to Node ABI.

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Verify release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm run migrate:ci
      - run: npm run fixture
      - run: npm test

  # Every main-branch check-in and PR gets downloadable, unsigned installers.
  # Every OS/architecture pair uses a native runner because encrypted SQLite is
  # native code; this makes the packaged launch smoke an ABI/architecture proof.
  package:
    name: Package (${{ matrix.platform }} ${{ matrix.arch }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            arch: arm64
            electron_cache: ~/Library/Caches/electron
            builder_cache: ~/Library/Caches/electron-builder
          - platform: macOS
            os: macos-15-intel
            arch: x64
            electron_cache: ~/Library/Caches/electron
            builder_cache: ~/Library/Caches/electron-builder
          - platform: Windows
            os: windows-latest
            arch: x64
            electron_cache: ~/AppData/Local/electron/Cache
            builder_cache: ~/AppData/Local/electron-builder/Cache
          - platform: Windows
            os: windows-11-arm
            arch: arm64
            electron_cache: ~/AppData/Local/electron/Cache
            builder_cache: ~/AppData/Local/electron-builder/Cache
          - platform: Linux
            os: ubuntu-latest
            arch: x64
            electron_cache: ~/.cache/electron
            builder_cache: ~/.cache/electron-builder
          - platform: Linux
            os: ubuntu-24.04-arm
            arch: arm64
            electron_cache: ~/.cache/electron
            builder_cache: ~/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.electron_cache }}
            ${{ matrix.builder_cache }}
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install rpm tooling (Linux)
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build unsigned installers
        run: npm run build -- --${{ matrix.arch }} --publish never
        env:
          # Check-in artifacts are for validation, not distribution. Disabling
          # discovery also prevents an incidental runner identity from signing.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # electron-builder 24 reads this standard CI slug while generating
          # update metadata, even when it is explicitly told not to publish.
          TRAVIS_REPO_SLUG: ${{ github.repository }}
      - name: Smoke test packaged application (Linux)
        if: matrix.platform == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.js
      - name: Smoke test packaged application (macOS/Windows)
        if: matrix.platform != 'Linux'
        run: node scripts/smoke-packaged.js

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Version tags publish signed/notarized installers to GitHub Releases.
  # A platform's architectures intentionally share one release job: builder
  # must generate one latest-*.yml containing every architecture rather than
  # two jobs racing to replace the same auto-update metadata asset. Native
  # architecture launch coverage is provided by the package matrix above.
  release:
    name: Release (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            electron_cache: ~/Library/Caches/electron
            builder_cache: ~/Library/Caches/electron-builder
          - platform: Windows
            os: windows-latest
            electron_cache: ~/AppData/Local/electron/Cache
            builder_cache: ~/AppData/Local/electron-builder/Cache
          - platform: Linux
            os: ubuntu-latest
            electron_cache: ~/.cache/electron
            builder_cache: ~/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.electron_cache }}
            ${{ matrix.builder_cache }}
          key: electron-${{ runner.os }}-release-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install rpm tooling (Linux)
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Verify release signing credentials
        if: matrix.platform != 'Linux'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ "${{ matrix.platform }}" == "macOS" ]]; then
            for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              [[ -n "${!name}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
            done
          else
            for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
              [[ -n "${!name}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
            done
          fi
      - name: Build and publish signed release
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAVIS_REPO_SLUG: ${{ github.repository }}
          # Platform signing (macOS also uses the notarization credentials below)
          CSC_LINK: ${{ matrix.platform == 'macOS' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS code signing and notarization
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          bundle="$(find dist -maxdepth 2 -type d -name Orbit.app | head -1)"
          [[ -n "$bundle" ]] || { echo "No unpacked Orbit.app found" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$bundle"
          spctl --assess --type execute --verbose=2 "$bundle"
      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $installers = Get-ChildItem dist -Filter *.exe
          if (-not $installers) { throw "No Windows installers found" }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($installer.Name) signature is $($signature.Status): $($signature.StatusMessage)"
            }
          }
      - name: Verify multi-architecture update metadata
        run: node scripts/verify-update-metadata.js "${{ matrix.platform }}"
      - name: Smoke test packaged application (Linux)
        if: matrix.platform == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.js
      - name: Smoke test packaged application (macOS/Windows)
        if: matrix.platform != 'Linux'
        run: node scripts/smoke-packaged.js

  # Keep partially uploaded or invalid artifacts private. A failed matrix leaves
  # a recoverable draft; only a wholly verified release becomes update-visible.
  finalize-release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote verified draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
