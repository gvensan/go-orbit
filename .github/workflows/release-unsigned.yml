name: release-unsigned

# Manual button: builds UNSIGNED installers for every OS/architecture and
# publishes them as a pre-release to the PUBLIC gvensan/orbit-releases repo so a
# handful of testers can download directly. Source stays in this private repo.
#
# These builds are not code-signed or notarized:
#   - macOS testers must right-click the app and choose Open (Gatekeeper warns),
#     or run: xattr -dr com.apple.quarantine /Applications/Orbit.app
#   - Windows testers will see a SmartScreen warning; choose More info -> Run anyway.
# The signed/notarized production path is the tag-driven `release` job in build.yml.
#
# Cross-repo publishing needs a token that can write to orbit-releases. The
# built-in GITHUB_TOKEN only reaches this repo, so provide a fine-grained PAT
# (Contents: Read and write on gvensan/orbit-releases) as the RELEASES_REPO_TOKEN
# secret in this repo.

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Optional label for the build (e.g. alpha, demo). Blank -> plain test build."
        required: false
        default: ""

concurrency:
  group: release-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One native runner per OS/architecture: encrypted SQLite is native code, so a
  # packaged launch smoke on each pair is the ABI/architecture proof.
  build:
    name: Build unsigned (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            arch: arm64
            electron_cache: ~/Library/Caches/electron
            builder_cache: ~/Library/Caches/electron-builder
          - platform: macOS
            os: macos-15-intel
            arch: x64
            electron_cache: ~/Library/Caches/electron
            builder_cache: ~/Library/Caches/electron-builder
          - platform: Windows
            os: windows-latest
            arch: x64
            electron_cache: ~/AppData/Local/electron/Cache
            builder_cache: ~/AppData/Local/electron-builder/Cache
          - platform: Windows
            os: windows-11-arm
            arch: arm64
            electron_cache: ~/AppData/Local/electron/Cache
            builder_cache: ~/AppData/Local/electron-builder/Cache
          - platform: Linux
            os: ubuntu-latest
            arch: x64
            electron_cache: ~/.cache/electron
            builder_cache: ~/.cache/electron-builder
          - platform: Linux
            os: ubuntu-24.04-arm
            arch: arm64
            electron_cache: ~/.cache/electron
            builder_cache: ~/.cache/electron-builder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.electron_cache }}
            ${{ matrix.builder_cache }}
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install rpm tooling (Linux)
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build unsigned installers
        run: npm run build -- --${{ matrix.arch }} --publish never
        env:
          # No signing identity: electron-builder skips signing and (having
          # nothing signed to notarize) skips notarization too.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # electron-builder reads this CI slug while generating metadata even
          # when told not to publish.
          TRAVIS_REPO_SLUG: ${{ github.repository }}
      - name: Configure Chromium sandbox (Linux)
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          mapfile -d '' sandboxes < <(find dist -maxdepth 2 -type f -name chrome-sandbox -print0)
          ((${#sandboxes[@]} > 0)) || { echo "No packaged chrome-sandbox found" >&2; exit 1; }
          sudo chown root:root "${sandboxes[@]}"
          sudo chmod 4755 "${sandboxes[@]}"
      - name: Smoke test packaged application (Linux)
        if: matrix.platform == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.js
      - name: Smoke test packaged application (macOS/Windows)
        if: matrix.platform != 'Linux'
        run: node scripts/smoke-packaged.js
      - name: Collect installers
        uses: actions/upload-artifact@v7
        with:
          name: orbit-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Gather every platform's installers and publish one pre-release to the public
  # releases repo. Only runs if every build leg succeeded (needs: build).
  publish:
    name: Publish to orbit-releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Download all installers
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Publish pre-release
        env:
          # PAT with Contents: write on gvensan/orbit-releases. The built-in
          # GITHUB_TOKEN cannot reach another repo.
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASES_REPO: gvensan/orbit-releases
          LABEL: ${{ inputs.label }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          slug="${LABEL:-test}"
          # Sanitize the label into a tag-safe slug.
          slug="$(printf '%s' "$slug" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-')"
          [[ -n "$slug" ]] || slug="test"
          tag="v${version}-${slug}.${GITHUB_RUN_NUMBER}"
          title="Orbit ${version} (${slug} build ${GITHUB_RUN_NUMBER})"

          mapfile -d '' assets < <(find artifacts -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.rpm' \) -print0)
          ((${#assets[@]} > 0)) || { echo "No installers found to publish" >&2; exit 1; }
          printf 'Publishing %d assets as %s\n' "${#assets[@]}" "$tag"

          notes=$'Unsigned test build for internal distribution.\n\n'
          notes+=$'**macOS:** right-click Orbit and choose Open (Gatekeeper warns on unsigned apps), '
          notes+=$'or run `xattr -dr com.apple.quarantine /Applications/Orbit.app`.\n'
          notes+=$'**Windows:** SmartScreen will warn - choose More info then Run anyway.\n\n'
          notes+="Built from private orbit-graph @ ${GITHUB_SHA}."

          gh release create "$tag" "${assets[@]}" \
            --repo "$RELEASES_REPO" \
            --title "$title" \
            --notes "$notes" \
            --prerelease
          echo "Published: https://github.com/${RELEASES_REPO}/releases/tag/${tag}"
