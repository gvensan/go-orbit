<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#111d36"/>
      <stop offset="100%" stop-color="#070c16"/>
    </radialGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fff1c2"/>
      <stop offset="45%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#d99a25"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded-square tile -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)" stroke="#1c2740" stroke-width="4"/>

  <!-- orbit ring + the contacts riding on it -->
  <g transform="rotate(-22 512 512)">
    <ellipse cx="512" cy="512" rx="372" ry="156" fill="none" stroke="#33507e" stroke-width="10" opacity="0.85"/>
    <!-- contacts (gender-ring colours from the app) -->
    <g>
      <circle cx="866" cy="566" r="40" fill="#2a3a5c"/>
      <circle cx="866" cy="566" r="40" fill="none" stroke="#ff2d95" stroke-width="8"/>
    </g>
    <g>
      <circle cx="196" cy="576" r="40" fill="#2a3a5c"/>
      <circle cx="196" cy="576" r="40" fill="none" stroke="#00c2ff" stroke-width="8"/>
    </g>
    <g>
      <circle cx="430" cy="372" r="40" fill="#2a3a5c"/>
      <circle cx="430" cy="372" r="40" fill="none" stroke="#3f9d76" stroke-width="8"/>
    </g>
  </g>

  <!-- you: the glowing gold centre -->
  <circle cx="512" cy="512" r="104" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="104" fill="none" stroke="#fff4d0" stroke-width="6" opacity="0.7"/>
</svg>
